services:
  ie4:
    hostname: ie4
    container_name: ie4
    image: simi23/ie4:latest
    environment:
      # Postgresql connection string
      DATABASE_URL: "postgresql://user:password@postgres:5432/database?schema=public"
      # Redis connection string
      REDIS_URL: "redis://redis"
      # The URL of the site for redirects and external links in emails
      NUXT_PUBLIC_SITE_NAME: "https://dash.infosokejszakaja.hu"
      # Set this to "1" to read IP addresses from X-Forwarded-For headers
      NUXT_TRUST_PROXY: "1"
      # Discord API Client ID
      NUXT_DISCORD_CLIENT_ID: "discord-client-id"
      # Discord API Client secret
      NUXT_DISCORD_CLIENT_SECRET: "discord-client-secret"
      # Discord Bot Token (for assigning roles to users)
      NUXT_DISCORD_BOT_TOKEN: "discord-bot-token"
    volumes:
      - images:/usr/src/app/public/images
      - uploads:/usr/src/app/uploads
    restart: unless-stopped
    ports:
      - 3000:3000
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
      POSTGRES_USER: user
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  pgdata:
  images:
  uploads:
